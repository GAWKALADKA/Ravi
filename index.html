<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gudu Shop Pro Max</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#f4f6f9}
header{background:#111;color:#fff;padding:15px;text-align:center;font-size:22px;font-weight:bold}
.hero{
background:url('https://i.ibb.co/wZ2k3pv5/photo-1513094735237-8f2714d57c13.jpg') center/cover no-repeat;
height:60vh;display:flex;align-items:center;justify-content:center;
color:#fff;position:relative;text-align:center}
.hero::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.6)}
.hero-content{position:relative;z-index:2}
.btn{padding:8px 15px;background:#ff6b00;border:none;color:#fff;border-radius:20px;cursor:pointer}
.products{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;padding:30px}
.card{background:#fff;width:220px;padding:15px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,.1);text-align:center}
.card img{width:100%;height:170px;object-fit:cover;border-radius:10px}
.price{color:#ff6b00;font-weight:bold;margin:8px 0}
.rating span{cursor:pointer;font-size:18px;color:#ccc}
.rating .active{color:gold}
.cart-icon{position:fixed;top:20px;right:20px;background:#ff6b00;color:#fff;padding:12px;border-radius:50%;cursor:pointer}
.cart-count{position:absolute;top:-5px;right:-5px;background:red;font-size:12px;padding:3px 6px;border-radius:50%}
.cart{position:fixed;right:-400px;top:0;width:350px;height:100%;background:#fff;box-shadow:-5px 0 15px rgba(0,0,0,.2);padding:20px;transition:.4s;overflow-y:auto}
.cart.active{right:0}
.cart-item{border-bottom:1px solid #ddd;padding:8px 0}
.remove{color:red;font-size:12px;cursor:pointer}
.total{font-weight:bold;margin:10px 0}
input{width:100%;padding:8px;margin:5px 0}
.history{background:#fff;margin:20px;padding:15px;border-radius:10px}
.tracking{background:#fff;margin:20px;padding:15px;border-radius:10px}
.whatsapp{position:fixed;bottom:20px;right:20px;background:#25D366;color:#fff;padding:10px 15px;border-radius:30px;text-decoration:none}
.qr-box{text-align:center;margin:10px 0}
</style>
</head>

<body>

<header>GUDU SHOP - Fresh Finds, Best Prices</header>

<div class="hero">
<div class="hero-content">
<h1>Welcome to Gudu Shop</h1>
<button class="btn" onclick="document.getElementById('products').scrollIntoView()">Shop Now</button>
</div>
</div>

<section class="products" id="products"></section>

<div class="cart-icon" onclick="toggleCart()">🛒
<span class="cart-count" id="count">0</span>
</div>

<div class="cart" id="cart">
<h2>Your Cart</h2>
<div id="items"></div>
<div class="total">Total: ₹<span id="total">0</span></div>
<input type="text" id="name" placeholder="Your Name">
<input type="text" id="phone" placeholder="Phone Number">
<button class="btn" onclick="showQR()">Pay Now</button>

<div id="paymentSection" style="display:none">
<div class="qr-box">
<img id="qrImage" width="200">
<p>Scan & Pay</p>
<button class="btn" onclick="confirmPayment()">Payment Done</button>
</div>
</div>
</div>

<div class="history">
<h3>Order History</h3>
<div id="orderHistory"></div>
</div>

<div class="tracking">
<h3>Track Order</h3>
<input type="text" id="trackId" placeholder="Enter Tracking ID">
<button class="btn" onclick="trackOrder()">Track</button>
<div id="trackResult"></div>
</div>

<a class="whatsapp" href="https://wa.me/7520947031" target="_blank">WhatsApp</a>

<script>
(function(){emailjs.init("L-E1QJKjWzHu3YtdK");})();

let products=[
{name:"Iphone 99",price:1000,img:"https://i.ibb.co/fY4DDK62/original-imahft5nxmyqndhf.jpg"},
{name:"Pova",price:17000,img:"https://i.ibb.co/k2wm3twM/61ik3-Qlkm-ML-AC-UF1000-1000-QL80-FMwebp.webp"},
{name:"Nothing Phone",price:22000,img:"https://i.ibb.co/QvBS9yFq/images-3.jpg"},
{name:"CMT",price:15000,img:"https://i.ibb.co/q3sVxW2J/original-imah3ajcxshpd2t2.jpg"},
{name:"Bracelet",price:1000,img:"https://i.ibb.co/3yv68YtJ/1-3-13.jpg"}
];

let cart=[];

products.forEach((p,i)=>{
document.getElementById("products").innerHTML+=`
<div class="card">
<img src="${p.img}">
<h3>${p.name}</h3>
<p class="price">₹${p.price}</p>
<div class="rating" id="rating-${i}">
${[1,2,3,4,5].map(s=>`<span onclick="rate(${i},${s})">★</span>`).join("")}
</div>
<button class="btn" onclick="addToCart('${p.name}',${p.price})">Add to Cart</button>
</div>`;
});

function toggleCart(){document.getElementById("cart").classList.toggle("active");}

function addToCart(name,price){
let item=cart.find(i=>i.name===name);
if(item){item.qty++}else{cart.push({name,price,qty:1})}
updateCart();
}

function updateCart(){
let html="";let total=0;let qty=0;
cart.forEach((item,i)=>{
total+=item.price*item.qty;qty+=item.qty;
html+=`<div class="cart-item">
<p>${item.name}</p>
<button onclick="changeQty(${i},-1)">-</button>${item.qty}
<button onclick="changeQty(${i},1)">+</button>
<p>₹${item.price*item.qty}</p>
<p class="remove" onclick="removeItem(${i})">Remove</p>
</div>`;
});
document.getElementById("items").innerHTML=html;
document.getElementById("total").innerText=total;
document.getElementById("count").innerText=qty;
}

function changeQty(i,c){cart[i].qty+=c;if(cart[i].qty<=0)cart.splice(i,1);updateCart();}
function removeItem(i){cart.splice(i,1);updateCart();}

function showQR(){
let total=document.getElementById("total").innerText;
let upi="upi://pay?pa=bihariiii@ptyes&pn=GuduShop&am="+total+"&cu=INR";
document.getElementById("qrImage").src=
"https://api.qrserver.com/v1/create-qr-code/?size=200x200&data="+encodeURIComponent(upi);
document.getElementById("paymentSection").style.display="block";
}

function confirmPayment(){
let trackingId="GUDU"+Math.floor(Math.random()*1000000);
let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let total=document.getElementById("total").innerText;

let invoice=`Tracking ID: ${trackingId}\nCustomer: ${name}\nPhone: ${phone}\nTotal: ₹${total}`;

emailjs.send("service_0xkt6c5","template_ob1kyu7",{
customer_name:name,
customer_phone:phone,
order_items:invoice
});

generatePDF(invoice);
saveHistory(invoice,trackingId);

cart=[];updateCart();
alert("Order Placed! Tracking ID: "+trackingId);
}

function generatePDF(text){
const { jsPDF }=window.jspdf;
let doc=new jsPDF();
doc.text("GUDU SHOP INVOICE",20,20);
doc.text(text,20,40);
doc.save("invoice.pdf");
}

function saveHistory(data,id){
let history=JSON.parse(localStorage.getItem("orders"))||[];
history.push({data,id,status:"Order Placed"});
localStorage.setItem("orders",JSON.stringify(history));
displayHistory();
}

function displayHistory(){
let history=JSON.parse(localStorage.getItem("orders"))||[];
document.getElementById("orderHistory").innerHTML=
history.map(h=>`<pre>${h.data}\nStatus: ${h.status}</pre><hr>`).join("");
}
displayHistory();

function trackOrder(){
let id=document.getElementById("trackId").value;
let history=JSON.parse(localStorage.getItem("orders"))||[];
let order=history.find(h=>h.id===id);
if(order){
document.getElementById("trackResult").innerHTML=
`Status: ${order.status}`;
}else{
document.getElementById("trackResult").innerHTML="Order Not Found";
}
}

function rate(index,stars){
localStorage.setItem("rating-"+index,stars);
showRating(index);
}

function showRating(index){
let stars=localStorage.getItem("rating-"+index);
let container=document.getElementById("rating-"+index);
if(!container)return;
[...container.children].forEach((star,i)=>{
star.classList.toggle("active",i<stars);
});
}
products.forEach((_,i)=>showRating(i));
</script>

</body>
  </html>
