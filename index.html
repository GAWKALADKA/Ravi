<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gudu Shop</title>
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#f5f7fa;}

header{
background:#111;
color:#fff;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.hero{
background:url('https://i.ibb.co/wZ2k3pv5/photo-1513094735237-8f2714d57c13.jpg') center/cover no-repeat;
height:80vh;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
position:relative;
text-align:center;
}

.hero::after{
content:'';
position:absolute;
inset:0;
background:rgba(0,0,0,0.5);
}

.hero-content{position:relative;z-index:2;}

.btn{
padding:8px 15px;
background:#ff6b00;
border:none;
color:white;
border-radius:20px;
cursor:pointer;
}

.products{
padding:40px 20px;
display:flex;
flex-wrap:wrap;
gap:20px;
justify-content:center;
}

.card{
background:#fff;
width:220px;
padding:15px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
text-align:center;
}

.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

.price{
font-weight:bold;
margin:10px 0;
color:#ff6b00;
}

.cart-icon{
position:fixed;
top:20px;
right:20px;
background:#ff6b00;
color:#fff;
padding:12px;
border-radius:50%;
cursor:pointer;
}

.cart-count{
position:absolute;
top:-5px;
right:-5px;
background:red;
font-size:12px;
padding:3px 6px;
border-radius:50%;
}

.cart{
position:fixed;
right:-400px;
top:0;
width:350px;
height:100%;
background:#fff;
box-shadow:-5px 0 15px rgba(0,0,0,0.2);
padding:20px;
transition:0.4s;
overflow-y:auto;
}

.cart.active{right:0;}

.cart-item{
border-bottom:1px solid #ddd;
padding:8px 0;
}

.qty-btn{
padding:3px 8px;
margin:0 5px;
cursor:pointer;
}

.remove{
color:red;
cursor:pointer;
font-size:12px;
}

.total{font-weight:bold;margin:10px 0;}

input{
width:100%;
padding:8px;
margin:5px 0;
}

.success{
display:none;
background:#4CAF50;
color:white;
padding:8px;
border-radius:5px;
margin-top:10px;
text-align:center;
}

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:10px 15px;
border-radius:30px;
text-decoration:none;
}
</style>
</head>

<body>

<header>GUDU SHOP - Fresh Finds, Best Prices</header>

<div class="hero">
<div class="hero-content">
<h1>Welcome to Gudu Shop</h1>
<button class="btn" onclick="document.getElementById('products').scrollIntoView()">Shop Now</button>
</div>
</div>

<section class="products" id="products">

<!-- Example Product -->
<div class="card">
<img src="https://i.ibb.co/fY4DDK62/original-imahft5nxmyqndhf.jpg">
<h3>Iphone 99</h3>
<p class="price">₹1000</p>
<button class="btn" onclick="addToCart('Iphone 99',1000)">Add to Cart</button>
</div>

</section>

<div class="cart-icon" onclick="toggleCart()">🛒
<span class="cart-count" id="count">0</span>
</div>

<div class="cart" id="cart">
<h2>Your Cart</h2>
<div id="items"></div>
<div class="total">Total: ₹<span id="total">0</span></div>

<input type="text" id="name" placeholder="Your Name">
<input type="text" id="phone" placeholder="Phone Number">
<button class="btn" onclick="sendOrder()">Send Order</button>

<div class="success" id="success">Order Sent Successfully ✅</div>
</div>

<a class="whatsapp" href="https://wa.me/7520947031" target="_blank">WhatsApp</a>

<script>
(function(){emailjs.init("L-E1QJKjWzHu3YtdK");})();

let cart=[];

function toggleCart(){
document.getElementById("cart").classList.toggle("active");
}

function addToCart(name,price){
let existing=cart.find(item=>item.name===name);
if(existing){
existing.qty++;
}else{
cart.push({name,price,qty:1});
}
updateCart();
}

function updateCart(){
let itemsHTML="";
let total=0;

cart.forEach((item,index)=>{
total+=item.price*item.qty;
itemsHTML+=`
<div class="cart-item">
<p>${item.name}</p>
<p>
<button class="qty-btn" onclick="changeQty(${index},-1)">-</button>
${item.qty}
<button class="qty-btn" onclick="changeQty(${index},1)">+</button>
</p>
<p>₹${item.price*item.qty}</p>
<p class="remove" onclick="removeItem(${index})">Remove</p>
</div>
`;
});

document.getElementById("items").innerHTML=itemsHTML;
document.getElementById("total").innerText=total;
document.getElementById("count").innerText=cart.length;
}

function changeQty(index,change){
cart[index].qty+=change;
if(cart[index].qty<=0){
cart.splice(index,1);
}
updateCart();
}

function removeItem(index){
cart.splice(index,1);
updateCart();
}

function sendOrder(){
let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;

let orderDetails=cart.map(item=>`${item.name} x${item.qty} = ₹${item.price*item.qty}`).join(", ");

emailjs.send("service_0xkt6c5","template_ob1kyu7",{
customer_name:name,
customer_phone:phone,
order_items:orderDetails
}).then(()=>{
document.getElementById("success").style.display="block";
cart=[];
updateCart();
});
}
</script>

</body>
</html>
