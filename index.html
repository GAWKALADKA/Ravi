<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gudu Shop</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif;}
body{background:#f4f6f8;color:#333;}
html{scroll-behavior:smooth;}

/* HERO */
.hero{
height:100vh;
background:url('https://i.ibb.co/wZ2k3pv5/photo-1513094735237-8f2714d57c13.jpg') center/cover no-repeat;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
position:relative;
}
.hero::after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,0.6);
}
.hero-content{position:relative;z-index:2;}
.hero h1{font-size:2.5rem;margin-bottom:10px;}
.hero p{margin-bottom:20px;font-size:1.2rem;}
.btn{
padding:12px 25px;
background:#ff7a00;
border:none;
color:white;
border-radius:5px;
cursor:pointer;
font-size:1rem;
}
.btn:hover{background:#e56d00;}

/* PRODUCTS */
.products{padding:40px 20px;}
.products h2{text-align:center;margin-bottom:20px;}
.carousel{
display:flex;
overflow-x:auto;
gap:20px;
scroll-snap-type:x mandatory;
}
.carousel::-webkit-scrollbar{display:none;}
.card{
min-width:250px;
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
scroll-snap-align:start;
}
.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:8px;
}
.price{color:#ff5722;font-weight:bold;margin:8px 0;}

/* CART ICON */
.cart-icon{
position:fixed;
top:20px;
right:20px;
background:#ff7a00;
width:50px;
height:50px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:22px;
cursor:pointer;
z-index:1000;
}
.count{
position:absolute;
top:-5px;
right:-5px;
background:red;
width:20px;
height:20px;
border-radius:50%;
font-size:12px;
display:flex;
align-items:center;
justify-content:center;
}

/* CART DRAWER */
.cart{
position:fixed;
right:-100%;
top:0;
width:100%;
max-width:400px;
height:100%;
background:white;
padding:20px;
box-shadow:-4px 0 15px rgba(0,0,0,0.2);
transition:0.3s;
overflow-y:auto;
z-index:2000;
}
.cart.active{right:0;}
.cart-item{border-bottom:1px solid #ddd;padding:8px 0;}

form input{
width:100%;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:5px;
}

/* WHATSAPP */
.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
width:55px;
height:55px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:26px;
text-decoration:none;
}
</style>
</head>
<body>

<!-- Floating Cart -->
<div class="cart-icon" onclick="toggleCart()">
🛒
<div class="count" id="count">0</div>
</div>

<!-- HERO -->
<section class="hero">
<div class="hero-content">
<h1>Gudu Shop</h1>
<p>Fresh Finds, Best Prices</p>
<button class="btn" onclick="document.getElementById('products').scrollIntoView()">Shop Now</button>
</div>
</section>

<!-- PRODUCTS -->
<section class="products" id="products">
<h2>Our Products</h2>

<div class="carousel">

<div class="card">
<img src="https://i.ibb.co/Y7HXMK3X/Screenshot-20260226-104144.jpg">
<h3>Product One</h3>
<div class="price">₹299</div>
<button class="btn" onclick="addToCart('Product One',299)">Add to Cart</button>
</div>

<div class="card">
<img src="https://i.ibb.co/RkGHmBGQ/51-CO7-Mr-NOL-AC-UF1000-1000-QL80-FMwebp.webp">
<h3>Product Two</h3>
<div class="price">₹499</div>
<button class="btn" onclick="addToCart('Product Two',499)">Add to Cart</button>
</div>

<div class="card">
<img src="https://i.ibb.co/nqmWTxW5/61b-FOaz-Nx-WL-AC-UF1000-1000-QL80-FMwebp.webp">
<h3>Product Three</h3>
<div class="price">₹699</div>
<button class="btn" onclick="addToCart('Product Three',699)">Add to Cart</button>
</div>

</div>
</section>

<!-- CART -->
<div class="cart" id="cart">
<h2>Your Cart</h2>
<div id="cartItems"></div>

<h3>Customer Details</h3>
<form id="orderForm">
<input type="text" id="name" placeholder="Your Name" required>
<input type="tel" id="phone" placeholder="Phone Number" required>
<button class="btn" type="submit">Send Order</button>
</form>
</div>

<!-- WhatsApp -->
<a href="https://wa.me/7520947031" class="whatsapp" target="_blank">💬</a>

<script>
(function(){
emailjs.init("L-E1QJKjWzHu3YtdK");
})();

let cart=[];

function addToCart(name,price){
cart.push({name,price});
updateCart();
}

function updateCart(){
document.getElementById("count").innerText=cart.length;
let items="";
cart.forEach(item=>{
items+=`<div class="cart-item">${item.name} - ₹${item.price}</div>`;
});
document.getElementById("cartItems").innerHTML=items;
}

function toggleCart(){
document.getElementById("cart").classList.toggle("active");
}

document.getElementById("orderForm").addEventListener("submit",function(e){
e.preventDefault();

if(cart.length===0){
alert("Cart is empty!");
return;
}

const templateParams={
customer_name:document.getElementById("name").value,
customer_phone:document.getElementById("phone").value,
order_items:cart.map(i=>`${i.name} - ₹${i.price}`).join("\n")
};

emailjs.send("service_0xkt6c5","template_ob1kyu7",templateParams)
.then(function(){
alert("Order Sent Successfully ✅");
cart=[];
updateCart();
toggleCart();
document.getElementById("orderForm").reset();
},function(error){
alert("Failed to send ❌");
console.log(error);
});
});
</script>

</body>
  </html>
