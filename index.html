<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Araman Dresses</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function(){
emailjs.init("L-E1QJKjWzHu3YtdK");
})();
</script>

<style>
body{margin:0;font-family:Segoe UI;background:#0f0f1a;color:white;}
header{
background:linear-gradient(90deg,#ff00cc,#3333ff,#00ffee);
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 0 15px #00ffee;
}
.logo{font-size:22px;font-weight:bold;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#1a1a2e;
padding:15px;
border-radius:12px;
text-align:center;
box-shadow:0 0 15px #00ffee;
transition:0.3s;
}
.card:hover{
transform:translateY(-8px);
box-shadow:0 0 25px #ff00cc;
}
.card img{
width:100%;
height:150px;
object-fit:contain;
border-radius:8px;
background:#111;
}

.price{color:#00ffee;font-weight:bold;margin-top:8px;}

.btn{
background:linear-gradient(45deg,#ff00cc,#00ffee);
border:none;
padding:10px;
margin-top:10px;
border-radius:8px;
color:white;
cursor:pointer;
box-shadow:0 0 10px #00ffee;
}
.btn:hover{box-shadow:0 0 20px #ff00cc;}

.cart-float{
position:fixed;
bottom:20px;
right:20px;
background:linear-gradient(45deg,#ff00cc,#00ffee);
padding:15px;
border-radius:50%;
cursor:pointer;
box-shadow:0 0 15px #00ffee;
}

.whatsapp{
position:fixed;
bottom:20px;
left:20px;
background:#25D366;
color:white;
padding:15px;
border-radius:50%;
text-decoration:none;
font-size:20px;
box-shadow:0 0 15px #25D366;
}

.cart-panel{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:350px;
max-height:80%;
background:#1a1a2e;
padding:20px;
border-radius:15px;
box-shadow:0 0 25px #ff00cc;
display:none;
overflow:auto;
}

.popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#1a1a2e;
padding:20px;
border-radius:15px;
box-shadow:0 0 25px #00ffee;
display:none;
text-align:center;
width:300px;
}

input{
width:100%;
padding:8px;
margin-top:8px;
border-radius:6px;
border:none;
}

.timer{
background:#ff0033;
text-align:center;
padding:8px;
box-shadow:0 0 15px red;
}
</style>
</head>

<body>

<header>
<div class="logo">Araman Dresses</div>
<div>
<span onclick="openAbout()" style="cursor:pointer;margin-right:15px;">About</span>
<span onclick="openCart()" style="cursor:pointer;">🛒</span>
</div>
</header>

<div class="timer" id="timer">Flash Sale Ends In: 10:00</div>

<div class="grid" id="products"></div>

<div class="cart-float" onclick="openCart()">🛒</div>

<a href="https://wa.me/7520947031" class="whatsapp" target="_blank">💬</a>

<!-- ABOUT POPUP -->
<div class="popup" id="aboutPopup">
<h3>Hi I am Aayu 👋</h3>
<p>Mai is website ka owner hu.<br>
Achha hua aapne visit kiya ❤️<br>
Mujhe ummeed hai aapko pasand aaya hoga.</p>
<button class="btn" onclick="closeAbout()">Close</button>
</div>

<!-- CART -->
<div class="cart-panel" id="cartPanel">
<h3>Your Cart</h3>
<div id="cartItems"></div>
<p>GST 18% + Delivery ₹50</p>
<input type="text" id="custName" placeholder="Your Name">
<input type="text" id="custPhone" placeholder="Phone Number">
<h4 id="total"></h4>
<button class="btn" onclick="checkout()">Proceed to Pay</button>
<button class="btn" onclick="closeCart()">Close</button>
</div>

<!-- PAYMENT -->
<div class="popup" id="paymentPopup">
<h3>UPI Payment</h3>
<p>Send ₹<span id="payAmount"></span></p>
<p>UPI: bihariiii@ptyes</p>
<button class="btn" onclick="confirmOrder()">Payment Done</button>
</div>

<!-- CONFIRM -->
<div class="popup" id="confirmPopup">
<h3>Order Confirmed 🎉</h3>
<p>Thank you for shopping!</p>
<button class="btn" onclick="location.reload()">OK</button>
</div>

<script>

let products=[
{name:"iPhone 99",price:1000,image:"https://i.ibb.co/fY4DDK62/original-imahft5nxmyqndhf.jpg"},
{name:"Pova",price:17000,image:"https://i.ibb.co/k2wm3twM/61ik3-Qlkm-ML-AC-UF1000-1000-QL80-FMwebp.webp"},
{name:"Nothing Phone",price:22000,image:"https://i.ibb.co/QvBS9yFq/images-3.jpg"},
{name:"CMT",price:15000,image:"https://i.ibb.co/q3sVxW2J/original-imah3ajcxshpd2t2.jpg"},
{name:"Bracelet",price:1000,image:"https://i.ibb.co/3yv68YtJ/1-3-13.jpg"}
];

let cart=[];

function displayProducts(){
let container=document.getElementById("products");
container.innerHTML="";
products.forEach((p,i)=>{
container.innerHTML+=`
<div class="card">
<img src="${p.image}">
<h4>${p.name}</h4>
<div class="price">₹${p.price}</div>
<button class="btn" onclick="addCart(${i})">Add to Cart</button>
</div>`;
});
}
displayProducts();

function addCart(i){
cart.push(products[i]);
alert("Added to cart");
}

function openCart(){
document.getElementById("cartPanel").style.display="block";
showCart();
}
function closeCart(){
document.getElementById("cartPanel").style.display="none";
}

function showCart(){
let items="";
let total=0;
cart.forEach(p=>{
items+=`<p>${p.name} - ₹${p.price}</p>`;
total+=p.price;
});
let gst=total*0.18;
let final=total+gst+50;
document.getElementById("cartItems").innerHTML=items;
document.getElementById("total").innerText="Total: ₹"+final.toFixed(0);
}

function checkout(){
let name=document.getElementById("custName").value;
let phone=document.getElementById("custPhone").value;

if(name=="" || phone==""){
alert("Please fill name & phone");
return;
}

let totalText=document.getElementById("total").innerText;
document.getElementById("payAmount").innerText=totalText.replace("Total: ₹","");
document.getElementById("paymentPopup").style.display="block";
}

function confirmOrder(){
let name=document.getElementById("custName").value;
let phone=document.getElementById("custPhone").value;
let items="";
cart.forEach(p=>{
items+=p.name+" - ₹"+p.price+"\n";
});
let totalText=document.getElementById("total").innerText;

emailjs.send("service_0xkt6c5","template_ob1kyu7",{
customer_name:name,
customer_phone:phone,
order_items:items,
order_total:totalText
}).then(function(){
document.getElementById("paymentPopup").style.display="none";
document.getElementById("confirmPopup").style.display="block";
},function(){
alert("Email Failed ❌");
});
}

function openAbout(){
document.getElementById("aboutPopup").style.display="block";
}
function closeAbout(){
document.getElementById("aboutPopup").style.display="none";
}

let time=600;
setInterval(()=>{
if(time>0){
time--;
let m=Math.floor(time/60);
let s=time%60;
if(s<10)s="0"+s;
document.getElementById("timer").innerText="Flash Sale Ends In: "+m+":"+s;
}
},1000);

</script>

</body>
</html>
