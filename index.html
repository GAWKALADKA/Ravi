<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gudu Shop</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#f4f6f9;
}

header{
position:fixed;
top:0;
width:100%;
background:#111;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
z-index:1000;
}

.logo{
font-size:20px;
font-weight:bold;
}

.cart-icon{
position:relative;
cursor:pointer;
}

.cart-count{
position:absolute;
top:-8px;
right:-8px;
background:red;
color:white;
border-radius:50%;
padding:3px 7px;
font-size:12px;
}

.hero{
height:100vh;
background:url('https://i.ibb.co/wZ2k3pv5/photo-1513094735237-8f2714d57c13.jpg') center/cover no-repeat;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
color:white;
text-align:center;
}

.hero h1{
font-size:40px;
background:rgba(0,0,0,0.5);
padding:10px 20px;
}

.hero button{
padding:12px 25px;
border:none;
background:#ff6600;
color:white;
cursor:pointer;
font-size:16px;
margin-top:15px;
}

.container{
padding:100px 20px 50px;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
}

.card{
background:white;
padding:10px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
text-align:center;
}

.card img{
width:100%;
height:150px;
object-fit:cover;
border-radius:8px;
}

.card button{
background:#111;
color:white;
border:none;
padding:8px 12px;
cursor:pointer;
margin-top:5px;
}

.cart-modal{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0);
background:white;
width:90%;
max-width:400px;
max-height:90vh;
overflow:auto;
padding:20px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
transition:.3s;
z-index:2000;
}

.cart-modal.active{
transform:translate(-50%,-50%) scale(1);
}

input{
width:100%;
padding:8px;
margin:5px 0;
}

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
background:#25D366;
color:white;
padding:15px;
border-radius:50%;
font-size:20px;
text-decoration:none;
}
</style>
</head>
<body>

<header>
<div class="logo">Gudu Shop</div>
<div class="cart-icon" onclick="openCart()">
🛒 <span class="cart-count" id="cartCount">0</span>
</div>
</header>

<section class="hero">
<h1>Fresh Finds, Best Prices</h1>
<button onclick="scrollToProducts()">Shop Now</button>
</section>

<div class="container">
<h2>Our Products</h2>
<div class="products" id="productList"></div>
</div>

<div class="cart-modal" id="cartModal">
<h3>Your Cart</h3>
<div id="cartItems"></div>
<h4>Total: ₹<span id="totalPrice">0</span></h4>

<input type="text" id="customerName" placeholder="Your Name">
<input type="text" id="customerPhone" placeholder="Phone Number">

<div id="qrcode"></div>

<button onclick="generateQR()">Generate Payment QR</button>
<button onclick="sendOrder()">Payment Done & Send Order</button>
<button onclick="closeCart()">Close</button>
</div>

<a href="https://wa.me/7520947031" class="whatsapp">💬</a>
  <script>

emailjs.init("L-E1QJKjWzHu3YtdK");

let cart = [];
let currentPage = 1;
let itemsPerPage = 20;

const categories = ["Mobile","Laptop","Headphone","Watch","Camera","Shoes","Shirt","Bag","Gaming","Accessory"];

const imagePool = [
"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9",
"https://images.unsplash.com/photo-1517336714731-489689fd1ca8",
"https://images.unsplash.com/photo-1518444065439-e933c06ce9cd",
"https://images.unsplash.com/photo-1523275335684-37898b6baf30",
"https://images.unsplash.com/photo-1508614589041-895b88991e3e",
"https://images.unsplash.com/photo-1519741497674-611481863552",
"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab",
"https://images.unsplash.com/photo-1507679799987-c73779587ccf",
"https://images.unsplash.com/photo-1587202372775-9897f1a9e3c6",
"https://images.unsplash.com/photo-1583394838336-acd977736f90"
];

let products = [];

for(let i=1;i<=1000;i++){
let category = categories[Math.floor(Math.random()*categories.length)];
let image = imagePool[Math.floor(Math.random()*imagePool.length)];
let price = Math.floor(Math.random()*90000)+500;

products.push({
id:i,
name:category+" Model "+i,
price:price,
img:image,
rating:Math.floor(Math.random()*5)+1
});
}

function displayProducts(){
let start = (currentPage-1)*itemsPerPage;
let end = start + itemsPerPage;
let paginatedItems = products.slice(start,end);

let html="";
paginatedItems.forEach(p=>{
html+=`
<div class="card">
<img src="${p.img}">
<h4>${p.name}</h4>
<p>₹${p.price}</p>
<p>${"⭐".repeat(p.rating)}</p>
<button onclick="addToCart(${p.id})">Add to Cart</button>
</div>
`;
});
document.getElementById("productList").innerHTML=html;
}

function addToCart(id){
let product = products.find(p=>p.id===id);
let existing = cart.find(item=>item.id===id);

if(existing){
existing.qty+=1;
}else{
cart.push({...product,qty:1});
}

updateCart();
}

function updateCart(){
let cartHTML="";
let total=0;
let totalQty=0;

cart.forEach(item=>{
total+=item.price*item.qty;
totalQty+=item.qty;

cartHTML+=`
<p>
${item.name} x ${item.qty}
<button onclick="changeQty(${item.id},1)">+</button>
<button onclick="changeQty(${item.id},-1)">-</button>
<button onclick="removeItem(${item.id})">Remove</button>
</p>
`;
});

document.getElementById("cartItems").innerHTML=cartHTML;
document.getElementById("totalPrice").innerText=total;
document.getElementById("cartCount").innerText=totalQty;
}

function changeQty(id,change){
let item = cart.find(i=>i.id===id);
if(!item) return;
item.qty+=change;
if(item.qty<=0){
cart = cart.filter(i=>i.id!==id);
}
updateCart();
}

function removeItem(id){
cart = cart.filter(i=>i.id!==id);
updateCart();
}

function openCart(){
document.getElementById("cartModal").classList.add("active");
}

function closeCart(){
document.getElementById("cartModal").classList.remove("active");
}

function scrollToProducts(){
window.scrollTo({top:window.innerHeight,behavior:"smooth"});
}

displayProducts();

  </script>
  <script>

let upiID = "bihariiii@ptyes";
let orderHistory = JSON.parse(localStorage.getItem("orders")) || [];

function generateQR(){
let total = document.getElementById("totalPrice").innerText;

if(total == 0){
alert("Cart is empty!");
return;
}

document.getElementById("qrcode").innerHTML="";

let upiLink = `upi://pay?pa=${upiID}&pn=GuduShop&am=${total}&cu=INR`;

new QRCode(document.getElementById("qrcode"), {
text: upiLink,
width:200,
height:200
});
}

function sendOrder(){

if(cart.length == 0){
alert("Cart empty!");
return;
}

let name = document.getElementById("customerName").value;
let phone = document.getElementById("customerPhone").value;

if(name=="" || phone==""){
alert("Fill customer details");
return;
}

let total = document.getElementById("totalPrice").innerText;

let itemsList = "";
cart.forEach(item=>{
itemsList += `${item.name} x ${item.qty} = ₹${item.price*item.qty}\n`;
});

let trackingID = "GUDU"+Math.floor(Math.random()*1000000);

let templateParams = {
customer_name: name,
customer_phone: phone,
order_items: itemsList,
order_total: total,
tracking_id: trackingID
};

emailjs.send("service_0xkt6c5","template_ob1kyu7",templateParams)
.then(function(){
alert("Order Sent Successfully!");
generatePDF(name,phone,itemsList,total,trackingID);

orderHistory.push({
name,phone,total,trackingID,date:new Date().toLocaleString()
});
localStorage.setItem("orders",JSON.stringify(orderHistory));

cart=[];
updateCart();
closeCart();
});

}

function generatePDF(name,phone,items,total,trackingID){
const { jsPDF } = window.jspdf;
const doc = new jsPDF();

doc.setFontSize(18);
doc.text("GUDU SHOP INVOICE",20,20);

doc.setFontSize(12);
doc.text("Customer: "+name,20,40);
doc.text("Phone: "+phone,20,50);
doc.text("Tracking ID: "+trackingID,20,60);
doc.text("Items:",20,75);

doc.text(items,20,85);
doc.text("Total: ₹"+total,20,130);

doc.save("Invoice_"+trackingID+".pdf");
}

</script>

</body>
</html>
