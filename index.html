<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gudu Shop</title>

<!-- EmailJS SDK -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}
body{
  background:#f8f9fa;
  color:#333;
}
html{
  scroll-behavior:smooth;
}

/* HERO */
.hero{
  height:100vh;
  background:url('https://i.ibb.co/wZ2k3pv5/photo-1513094735237-8f2714d57c13.jpg') center/cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#fff;
  position:relative;
}
.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.55);
}
.hero-content{
  position:relative;
  z-index:2;
}
.hero h1{
  font-size:2.5rem;
  margin-bottom:15px;
}
.hero p{
  margin-bottom:20px;
  font-size:1.1rem;
}
.btn{
  padding:12px 25px;
  background:#ff9800;
  border:none;
  color:#fff;
  font-size:1rem;
  cursor:pointer;
  border-radius:5px;
  transition:0.3s;
}
.btn:hover{
  background:#e68900;
}

/* PRODUCTS */
.products{
  padding:40px 20px;
}
.products h2{
  text-align:center;
  margin-bottom:20px;
}
.carousel{
  display:flex;
  overflow-x:auto;
  gap:20px;
  scroll-snap-type:x mandatory;
}
.carousel::-webkit-scrollbar{
  display:none;
}
.product-card{
  min-width:250px;
  background:#fff;
  padding:15px;
  border-radius:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  scroll-snap-align:start;
}
.product-card img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:8px;
}
.product-card h3{
  margin:10px 0 5px;
}
.price{
  color:#ff5722;
  font-weight:bold;
  margin-bottom:10px;
}

/* FLOATING CART */
.cart-icon{
  position:fixed;
  top:20px;
  right:20px;
  background:#ff9800;
  color:#fff;
  width:50px;
  height:50px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-size:22px;
  cursor:pointer;
  z-index:999;
}
.cart-count{
  position:absolute;
  top:-5px;
  right:-5px;
  background:red;
  color:#fff;
  font-size:12px;
  width:20px;
  height:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
}

/* CART DRAWER */
.cart-drawer{
  position:fixed;
  right:-100%;
  top:0;
  width:100%;
  max-width:400px;
  height:100%;
  background:#fff;
  box-shadow:-4px 0 10px rgba(0,0,0,0.2);
  transition:0.3s;
  padding:20px;
  overflow-y:auto;
  z-index:1000;
}
.cart-drawer.active{
  right:0;
}
.cart-item{
  margin-bottom:10px;
  border-bottom:1px solid #ddd;
  padding-bottom:5px;
}

/* FORM */
form input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:1px solid #ccc;
  border-radius:5px;
}
form button{
  width:100%;
}

/* WHATSAPP */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  color:#fff;
  width:55px;
  height:55px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  text-decoration:none;
}
</style>
</head>
<body>

<!-- Floating Cart -->
<div class="cart-icon" onclick="toggleCart()">
🛒
<div class="cart-count" id="cartCount">0</div>
</div>

<!-- HERO SECTION -->
<section class="hero">
  <div class="hero-content">
    <h1>Gudu Shop</h1>
    <p>Fresh Finds, Best Prices</p>
    <button class="btn" onclick="document.getElementById('products').scrollIntoView()">Shop Now</button>
  </div>
</section>

<!-- PRODUCTS -->
<section class="products" id="products">
<h2>Our Products</h2>
<div class="carousel">

<div class="product-card">
<img src="https://i.ibb.co/Y7HXMK3X/Screenshot-20260226-104144.jpg">
<h3>Product One</h3>
<p class="price">₹299</p>
<button class="btn" onclick="addToCart('Product One',299)">Add to Cart</button>
</div>

<div class="product-card">
<img src="https://i.ibb.co/RkGHmBGQ/51-CO7-Mr-NOL-AC-UF1000-1000-QL80-FMwebp.webp">
<h3>Product Two</h3>
<p class="price">₹499</p>
<button class="btn" onclick="addToCart('Product Two',499)">Add to Cart</button>
</div>

<div class="product-card">
<img src="https://i.ibb.co/nqmWTxW5/61b-FOaz-Nx-WL-AC-UF1000-1000-QL80-FMwebp.webp">
<h3>Product Three</h3>
<p class="price">₹699</p>
<button class="btn" onclick="addToCart('Product Three',699)">Add to Cart</button>
</div>

</div>
</section>

<!-- CART DRAWER -->
<div class="cart-drawer" id="cartDrawer">
<h2>Your Cart</h2>
<div id="cartItems"></div>

<h3>Customer Details</h3>
<form id="orderForm">
<input type="text" id="customerName" placeholder="Your Name" required>
<input type="tel" id="customerPhone" placeholder="Phone Number" required>
<button type="submit" class="btn">Send Order</button>
</form>
</div>

<!-- WhatsApp Button -->
<a href="https://wa.me/7520947031" class="whatsapp" target="_blank">💬</a>

<script>
// INIT EMAILJS
(function(){
  emailjs.init("YOUR_PUBLIC_KEY"); // Replace with EmailJS Public Key
})();

let cart = [];

function addToCart(name, price){
  cart.push({name, price});
  updateCart();
}

function updateCart(){
  document.getElementById("cartCount").innerText = cart.length;
  const cartItems = document.getElementById("cartItems");
  cartItems.innerHTML = "";
  cart.forEach(item=>{
    cartItems.innerHTML += `<div class="cart-item">${item.name} - ₹${item.price}</div>`;
  });
}

function toggleCart(){
  document.getElementById("cartDrawer").classList.toggle("active");
}

// SEND ORDER
document.getElementById("orderForm").addEventListener("submit", function(e){
  e.preventDefault();

  if(cart.length === 0){
    alert("Cart is empty!");
    return;
  }

  const name = document.getElementById("customerName").value;
  const phone = document.getElementById("customerPhone").value;

  const itemsList = cart.map(item=> `${item.name} - ₹${item.price}`).join("\n");

  const templateParams = {
    customer_name: name,
    customer_phone: phone,
    order_items: itemsList,
    to_email: "earningsaayu@gmail.com"
  };

  emailjs.send("YOUR_SERVICE_ID","YOUR_TEMPLATE_ID",templateParams)
  .then(function(){
    alert("Order Sent Successfully!");
    cart = [];
    updateCart();
    toggleCart();
    document.getElementById("orderForm").reset();
  }, function(error){
    alert("Failed to send order.");
  });

});
</script>

</body>
  </html>
