<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gudu Shop - Premium</title>

<style>
body{
margin:0;
font-family: 'Segoe UI', sans-serif;
background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
color:white;
overflow-x:hidden;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 25px;
background:rgba(0,0,0,0.6);
backdrop-filter: blur(10px);
position:sticky;
top:0;
z-index:1000;
}

.logo{
font-size:22px;
font-weight:bold;
color:#00f7ff;
}

.cart-icon{
position:fixed;
bottom:30px;
right:30px;
background:#00f7ff;
color:black;
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
cursor:pointer;
box-shadow:0 0 20px #00f7ff;
transition:0.3s;
z-index:999;
}

.cart-icon:hover{
transform:scale(1.1);
}

.cart-count{
position:absolute;
top:-8px;
right:-8px;
background:red;
color:white;
font-size:12px;
padding:4px 7px;
border-radius:50%;
}

.about-btn{
background:#00f7ff;
border:none;
padding:8px 15px;
border-radius:6px;
cursor:pointer;
color:black;
font-weight:bold;
box-shadow:0 0 15px #00f7ff;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
padding:30px;
max-width:1300px;
margin:auto;
}

.card{
background:rgba(255,255,255,0.05);
border-radius:15px;
padding:15px;
text-align:center;
backdrop-filter: blur(8px);
transition:0.4s;
opacity:0;
transform:translateY(30px);
}

.card.show{
opacity:1;
transform:translateY(0);
}

.card:hover{
transform:translateY(-10px) scale(1.03);
box-shadow:0 0 20px #00f7ff;
}

.card img{
width:100%;
height:200px;
object-fit:cover;
border-radius:12px;
}

.price{
color:#00f7ff;
font-weight:bold;
}

.add-btn{
margin-top:10px;
background:#00f7ff;
color:black;
border:none;
padding:8px 12px;
border-radius:6px;
cursor:pointer;
box-shadow:0 0 15px #00f7ff;
}

.cart{
position:fixed;
top:0;
right:-400px;
width:350px;
height:100%;
background:#111;
padding:20px;
transition:0.4s;
overflow:auto;
z-index:2000;
}

.cart.active{
right:0;
}

.cart-item{
margin-bottom:15px;
border-bottom:1px solid #333;
padding-bottom:10px;
}

.qty-btn{
margin:0 5px;
background:#00f7ff;
border:none;
padding:4px 8px;
cursor:pointer;
}

.remove{
color:red;
cursor:pointer;
font-size:13px;
}

.total{
margin-top:10px;
font-size:18px;
color:#00f7ff;
}

.about-popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:25px;
width:90%;
max-width:400px;
display:none;
border-radius:12px;
box-shadow:0 0 25px #00f7ff;
text-align:center;
z-index:3000;
}

.about-popup button{
margin-top:15px;
background:#00f7ff;
border:none;
padding:8px 15px;
cursor:pointer;
}

.whatsapp{
position:fixed;
bottom:30px;
left:30px;
background:#25D366;
color:white;
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
text-decoration:none;
box-shadow:0 0 15px #25D366;
}
</style>
</head>

<body>

<header>
<div class="logo">Gudu Shop</div>
<button class="about-btn" onclick="openAbout()">About Me</button>
</header>

<div class="container" id="productContainer"></div>

<div class="cart-icon" onclick="toggleCart()">
🛒
<span class="cart-count" id="cartCount">0</span>
</div>

<div class="cart" id="cart">
<h2>Your Cart</h2>
<div id="cartItems"></div>
<div class="total">Total: ₹<span id="totalPrice">0</span></div>
<br>
<button class="add-btn" onclick="toggleCart()">Close</button>
</div>

<div class="about-popup" id="aboutPopup">
<h3>About Me</h3>
<p>
Hi I am <b>Aayu</b> 👋<br><br>
Ma is website ka owner hu.<br>
Achha huaa aapne website visit kiya 😊<br>
Mujhe lagta hai aapko ye pasand aaya hoga.<br><br>
Thank you ❤️
</p>
<button onclick="closeAbout()">Close</button>
</div>

<a href="https://wa.me/7520947031" class="whatsapp">💬</a>

<script>
const products=[
{name:"Iphone 99",price:1000,image:"https://i.ibb.co/fY4DDK62/original-imahft5nxmyqndhf.jpg"},
{name:"Pova",price:17000,image:"https://i.ibb.co/k2wm3twM/61ik3-Qlkm-ML-AC-UF1000-1000-QL80-FMwebp.webp"},
{name:"Nothing Phone",price:22000,image:"https://i.ibb.co/QvBS9yFq/images-3.jpg"},
{name:"CMT Phone",price:15000,image:"https://i.ibb.co/q3sVxW2J/original-imah3ajcxshpd2t2.jpg"},
{name:"Bracelet",price:1000,image:"https://i.ibb.co/3yv68YtJ/1-3-13.jpg"},
{name:"Smart Watch",price:2999,image:"https://images.unsplash.com/photo-1516574187841-cb9cc2ca948b"},
{name:"Headphones",price:1999,image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e"},
{name:"Gaming Mouse",price:1499,image:"https://images.unsplash.com/photo-1587202372775-e229f172b9d7"},
{name:"Bluetooth Speaker",price:2499,image:"https://images.unsplash.com/photo-1518444065439-e933c06ce9cd"},
{name:"DSLR Camera",price:45999,image:"https://images.unsplash.com/photo-1519183071298-a2962be96b9f"},
{name:"Laptop Pro",price:59999,image:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853"},
{name:"Drone 4K",price:34999,image:"https://images.unsplash.com/photo-1473968512647-3e447244af8f"},
{name:"LED TV",price:28999,image:"https://images.unsplash.com/photo-1593359677879-a4bb92f829d1"},
{name:"Power Bank",price:1299,image:"https://images.unsplash.com/photo-1580894908361-967195033215"},
{name:"Tablet",price:19999,image:"https://images.unsplash.com/photo-1546054454-aa26e2b734c7"},
{name:"AirPods",price:2999,image:"https://images.unsplash.com/photo-1585386959984-a4155224a1ad"},
{name:"Smart Band",price:999,image:"https://images.unsplash.com/photo-1579586337278-3befd40fd17a"},
{name:"VR Headset",price:4999,image:"https://images.unsplash.com/photo-1593508512255-86ab42a8e620"},
{name:"Gaming Keyboard",price:1999,image:"https://images.unsplash.com/photo-1517336714731-489689fd1ca8"},
{name:"Portable Fan",price:699,image:"https://images.unsplash.com/photo-1582719471387-02dbe1b3c0c4"}
];

let cart=[];

function displayProducts(){
const container=document.getElementById("productContainer");
products.forEach((p,i)=>{
container.innerHTML+=`
<div class="card">
<img src="${p.image}">
<h3>${p.name}</h3>
<p class="price">₹${p.price}</p>
<button class="add-btn" onclick="addToCart(${i})">Add to Cart</button>
</div>`;
});
setTimeout(()=>{
document.querySelectorAll(".card").forEach(card=>card.classList.add("show"));
},200);
}

function addToCart(i){
let item=cart.find(c=>c.index===i);
if(item){item.qty++;}
else{cart.push({index:i,qty:1});}
updateCart();
}

function updateCart(){
let html="";
let total=0,totalQty=0;
cart.forEach((c,i)=>{
let p=products[c.index];
total+=p.price*c.qty;
totalQty+=c.qty;
html+=`
<div class="cart-item">
${p.name}<br>
<button class="qty-btn" onclick="changeQty(${i},-1)">-</button>
${c.qty}
<button class="qty-btn" onclick="changeQty(${i},1)">+</button>
<br><span class="remove" onclick="removeItem(${i})">Remove</span>
<div>₹${p.price*c.qty}</div>
</div>`;
});
document.getElementById("cartItems").innerHTML=html;
document.getElementById("totalPrice").innerText=total;
document.getElementById("cartCount").innerText=totalQty;
}

function changeQty(i,v){
cart[i].qty+=v;
if(cart[i].qty<=0)cart.splice(i,1);
updateCart();
}

function removeItem(i){
cart.splice(i,1);
updateCart();
}

function toggleCart(){
document.getElementById("cart").classList.toggle("active");
}

function openAbout(){
document.getElementById("aboutPopup").style.display="block";
}

function closeAbout(){
document.getElementById("aboutPopup").style.display="none";
}

displayProducts();
</script>

</body>
</html>
