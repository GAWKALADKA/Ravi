<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Araman Dresses</title>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#0f0c29,#1a1a2e,#16213e);
color:white;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 25px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(15px);
box-shadow:0 0 25px #00f0ff55;
}
.logo{
font-size:24px;
font-weight:bold;
color:#00f0ff;
text-shadow:0 0 15px #00f0ff;
}

/* PRODUCTS */
.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
padding:30px;
}
.card{
background:rgba(255,255,255,0.05);
border-radius:15px;
padding:18px;
text-align:center;
border:1px solid #00f0ff40;
}
.card img{
width:100%;
height:200px;
object-fit:contain;
}
.price{color:#00ff99;font-weight:bold;margin:8px 0}
.add-btn{
background:#00f0ff;
border:none;
padding:10px;
width:100%;
border-radius:25px;
cursor:pointer;
font-weight:bold;
}

/* CART */
.cart-icon{
position:fixed;
bottom:30px;
right:30px;
background:#00f0ff;
color:black;
width:65px;height:65px;
border-radius:50%;
display:flex;align-items:center;justify-content:center;
font-size:26px;
cursor:pointer;
}
.cart-count{
position:absolute;
top:-6px;right:-6px;
background:red;color:white;
font-size:12px;
padding:4px 7px;
border-radius:50%;
}

.cart{
position:fixed;
top:0;
right:-400px;
width:350px;
height:100%;
background:#111827;
padding:20px;
transition:.4s;
overflow:auto;
}
.cart.active{right:0}

.cart-item{text-align:center;margin:10px 0}
.total{text-align:center;margin-top:10px;font-weight:bold;color:#00ff99}

input{
width:100%;
padding:8px;
margin:6px 0;
border-radius:8px;
border:none;
}

/* PAYMENT MODAL */
#paymentModal{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%) scale(0);
background:#111827;
padding:25px;
width:90%;
max-width:350px;
border-radius:15px;
box-shadow:0 0 30px #00f0ff;
transition:.4s;
z-index:2000;
text-align:center;
}
#paymentModal.active{transform:translate(-50%,-50%) scale(1)}
</style>
</head>

<body>

<header>
<div class="logo">Araman Dresses</div>
</header>

<div class="container" id="productContainer"></div>

<div class="cart-icon" onclick="toggleCart()">
🛒 <span class="cart-count" id="cartCount">0</span>
</div>

<div class="cart" id="cart">
<h2 style="text-align:center;color:#00f0ff">Your Cart</h2>
<div id="cartItems"></div>
<div class="total">Total: ₹<span id="totalPrice">0</span></div>
<input type="text" id="custName" placeholder="Your Name">
<input type="number" id="custPhone" placeholder="Phone Number">
<button class="add-btn" onclick="openPayment()">Proceed to Payment</button>
</div>

<div id="paymentModal">
<h3 style="color:#00f0ff">Pay via UPI</h3>
<p>UPI ID:</p>
<b>bihariiii@ptyes</b>
<br><br>
<button class="add-btn" onclick="sendOrder()">I Have Paid</button>
<br><br>
<button onclick="closePayment()">Cancel</button>
</div>

<script>
(function(){
emailjs.init("L-E1QJKjWzHu3YtdK");
})();

const products=[
{name:"Iphone 99",price:1000,image:"https://i.ibb.co/fY4DDK62/original-imahft5nxmyqndhf.jpg"},
{name:"Pova",price:17000,image:"https://i.ibb.co/k2wm3twM/61ik3-Qlkm-ML-AC-UF1000-1000-QL80-FMwebp.webp"},
{name:"Nothing Phone",price:22000,image:"https://i.ibb.co/QvBS9yFq/images-3.jpg"},
{name:"Bracelet",price:1000,image:"https://i.ibb.co/3yv68YtJ/1-3-13.jpg"}
];

let cart=[];

function displayProducts(){
const container=document.getElementById("productContainer");
products.forEach((p,i)=>{
container.innerHTML+=`
<div class="card">
<img src="${p.image}">
<h4>${p.name}</h4>
<div class="price">₹${p.price}</div>
<button class="add-btn" onclick="addToCart(${i})">Add to Cart</button>
</div>`;
});
}
displayProducts();

function addToCart(i){
let item=cart.find(c=>c.index===i);
if(item){item.qty++;}
else{cart.push({index:i,qty:1});}
updateCart();
}

function updateCart(){
let html="",total=0,totalQty=0;
cart.forEach((c)=>{
let p=products[c.index];
total+=p.price*c.qty;
totalQty+=c.qty;
html+=`${p.name} x ${c.qty}<br>`;
});
document.getElementById("cartItems").innerHTML=html;
document.getElementById("totalPrice").innerText=total;
document.getElementById("cartCount").innerText=totalQty;
}

function toggleCart(){
document.getElementById("cart").classList.toggle("active");
}

function openPayment(){
document.getElementById("paymentModal").classList.add("active");
}

function closePayment(){
document.getElementById("paymentModal").classList.remove("active");
}

function sendOrder(){
let name=document.getElementById("custName").value;
let phone=document.getElementById("custPhone").value;

let items="";
let total=0;

cart.forEach(c=>{
let p=products[c.index];
items+=p.name+" x "+c.qty+"\n";
total+=p.price*c.qty;
});

emailjs.send("service_0xkt6c5","template_ob1kyu7",{
customer_name:name,
customer_phone:phone,
order_items:items,
total_amount:total
}).then(function(){
alert("Order Sent Successfully ✅");
cart=[];
updateCart();
closePayment();
toggleCart();
},function(error){
alert("Email Failed ❌");
});
}
</script>

</body>
</html>
