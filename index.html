<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Araman Dresses</title>

<style>
body{
margin:0;
font-family:'Segoe UI',sans-serif;
background:#0f0f1a;
color:white;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 20px;
background:#111827;
box-shadow:0 0 20px #00f0ff;
}
.logo{
font-size:22px;
font-weight:bold;
color:#00f0ff;
text-shadow:0 0 10px #00f0ff;
}
.search-box{flex:1;margin:0 20px;}
.search-box input{
width:100%;
padding:8px;
border:none;
border-radius:4px;
outline:none;
}

.filters{
display:flex;
gap:10px;
padding:15px;
flex-wrap:wrap;
justify-content:center;
background:#0f172a;
}
.filter-btn{
padding:6px 12px;
border:1px solid #00f0ff;
background:transparent;
color:#00f0ff;
cursor:pointer;
border-radius:20px;
}
.filter-btn.active,.filter-btn:hover{
background:#00f0ff;
color:black;
}

.container{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
padding:20px;
max-width:1300px;
margin:auto;
}
@media(max-width:1000px){.container{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.container{grid-template-columns:1fr;}}

.card{
background:#111827;
border-radius:10px;
padding:15px;
text-align:center;
position:relative;
transition:0.3s;
border:1px solid #00f0ff;
}
.card:hover{
box-shadow:0 0 20px #00f0ff;
transform:translateY(-5px);
}
.card img{
width:100%;
height:200px;
object-fit:contain;
}
.discount{
position:absolute;
top:10px;
left:10px;
background:#ff0066;
color:white;
padding:3px 6px;
font-size:12px;
border-radius:3px;
}
.price{
color:#00ff99;
font-weight:bold;
margin:6px 0;
}
.old-price{
text-decoration:line-through;
color:gray;
font-size:14px;
}
.rating{
color:#ffd700;
font-size:14px;
}
.add-btn{
background:#00f0ff;
border:none;
padding:8px;
width:100%;
cursor:pointer;
color:black;
border-radius:4px;
font-weight:bold;
}

.cart-icon{
position:fixed;
bottom:30px;
right:30px;
background:#00f0ff;
color:black;
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
cursor:pointer;
box-shadow:0 0 20px #00f0ff;
}
.cart-count{
position:absolute;
top:-6px;
right:-6px;
background:red;
color:white;
font-size:12px;
padding:3px 6px;
border-radius:50%;
}

.cart{
position:fixed;
top:0;
right:-400px;
width:350px;
height:100%;
background:#111827;
padding:20px;
transition:0.4s;
overflow:auto;
box-shadow:0 0 20px #00f0ff;
}
.cart.active{right:0;}

.cart h2{
text-align:center;
color:#00f0ff;
}

#cartItems{
text-align:center;
margin-top:20px;
margin-bottom:20px;
}

.total{
font-weight:bold;
margin-top:10px;
text-align:center;
color:#00ff99;
}

input{
width:100%;
padding:6px;
margin:5px 0;
border-radius:4px;
border:none;
}

button{cursor:pointer;}
</style>
</head>

<body>

<header>
<div class="logo">Araman Dresses</div>
<div class="search-box">
<input type="text" id="searchInput" placeholder="Search..." onkeyup="searchProduct()">
</div>
</header>

<div class="filters">
<button class="filter-btn active" onclick="filterCategory('All',this)">All</button>
<button class="filter-btn" onclick="filterCategory('Mobile',this)">Mobile</button>
<button class="filter-btn" onclick="filterCategory('Electronics',this)">Electronics</button>
<button class="filter-btn" onclick="filterCategory('Accessories',this)">Accessories</button>
<button class="filter-btn" onclick="filterCategory('Fashion',this)">Fashion</button>
</div>

<div class="container" id="productContainer"></div>

<div class="cart-icon" onclick="toggleCart()">
🛒 <span class="cart-count" id="cartCount">0</span>
</div>

<div class="cart" id="cart">
<h2>Your Cart</h2>
<div id="cartItems"></div>
<div class="total">Total: ₹<span id="totalPrice">0</span></div>
<input type="text" id="custName" placeholder="Your Name">
<input type="number" id="custPhone" placeholder="Phone Number">
<button class="add-btn" onclick="submitOrder()">Submit Order</button>
<button onclick="toggleCart()">Close</button>
</div>

<script>
const products=[
{name:"Iphone 99",price:1000,old:1500,cat:"Mobile",rating:4,image:"https://i.ibb.co/fY4DDK62/original-imahft5nxmyqndhf.jpg"},
{name:"Pova",price:17000,old:19000,cat:"Mobile",rating:5,image:"https://i.ibb.co/k2wm3twM/61ik3-Qlkm-ML-AC-UF1000-1000-QL80-FMwebp.webp"},
{name:"Nothing Phone",price:22000,old:25000,cat:"Mobile",rating:4,image:"https://i.ibb.co/QvBS9yFq/images-3.jpg"},
{name:"CMT Phone",price:15000,old:18000,cat:"Mobile",rating:3,image:"https://i.ibb.co/q3sVxW2J/original-imah3ajcxshpd2t2.jpg"},
{name:"Bracelet",price:1000,old:1500,cat:"Fashion",rating:4,image:"https://i.ibb.co/3yv68YtJ/1-3-13.jpg"}
];

let filteredProducts=[...products];
let cart=[];

function displayProducts(){
const container=document.getElementById("productContainer");
container.innerHTML="";
filteredProducts.forEach((p,i)=>{
let stars="★".repeat(p.rating)+"☆".repeat(5-p.rating);
container.innerHTML+=`
<div class="card">
<div class="discount">${Math.round((1-p.price/p.old)*100)}% OFF</div>
<img src="${p.image}" onerror="this.src='https://via.placeholder.com/200x200?text=No+Image'">
<h4>${p.name}</h4>
<div class="rating">${stars}</div>
<div class="old-price">₹${p.old}</div>
<div class="price">₹${p.price}</div>
<button class="add-btn" onclick="addToCart(${products.indexOf(p)})">Add to Cart</button>
</div>`;
});
}
displayProducts();

function searchProduct(){
let val=document.getElementById("searchInput").value.toLowerCase();
filteredProducts=products.filter(p=>p.name.toLowerCase().includes(val));
displayProducts();
}

function filterCategory(cat,btn){
document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
if(cat=="All"){filteredProducts=[...products];}
else{filteredProducts=products.filter(p=>p.cat==cat);}
displayProducts();
}

function addToCart(i){
let item=cart.find(c=>c.index===i);
if(item){item.qty++;}
else{cart.push({index:i,qty:1});}
updateCart();
}

function updateCart(){
let html="",total=0,totalQty=0;
cart.forEach((c,i)=>{
let p=products[c.index];
total+=p.price*c.qty;
totalQty+=c.qty;
html+=`${p.name} x ${c.qty}<br>`;
});
document.getElementById("cartItems").innerHTML=html;
document.getElementById("totalPrice").innerText=total;
document.getElementById("cartCount").innerText=totalQty;
}

function toggleCart(){document.getElementById("cart").classList.toggle("active");}
function submitOrder(){alert("Order Submitted Successfully!");cart=[];updateCart();toggleCart();}
</script>

</body>
</html>
