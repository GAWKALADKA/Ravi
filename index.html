<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gudu Shop</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f4f4f4;
}

header{
background:black;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.cart-icon{
position:relative;
cursor:pointer;
font-size:22px;
}

.cart-count{
position:absolute;
top:-8px;
right:-10px;
background:red;
color:white;
font-size:12px;
padding:3px 7px;
border-radius:50%;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
max-width:1200px;
margin:auto;
}

.card{
background:white;
border-radius:12px;
padding:15px;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
border-radius:10px;
}

button{
padding:10px 15px;
border:none;
border-radius:6px;
cursor:pointer;
}

.add-btn{
background:black;
color:white;
margin-top:10px;
}

.about-btn{
background:orange;
color:white;
margin-left:10px;
}

.cart{
position:fixed;
top:0;
right:-100%;
width:320px;
height:100%;
background:white;
box-shadow:-4px 0 10px rgba(0,0,0,0.2);
transition:0.4s;
padding:20px;
overflow:auto;
z-index:1000;
}

.cart.active{
right:0;
}

.cart-item{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

.qty-btn{
padding:3px 8px;
margin:0 5px;
}

.remove{
color:red;
cursor:pointer;
font-size:14px;
}

.total{
font-weight:bold;
margin-top:10px;
}

.about-popup{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:20px;
width:90%;
max-width:400px;
box-shadow:0 4px 10px rgba(0,0,0,0.3);
display:none;
z-index:2000;
border-radius:10px;
text-align:center;
}

.about-popup button{
margin-top:15px;
background:black;
color:white;
}
</style>
</head>

<body>

<header>
<h2>Gudu Shop</h2>
<div>
<button class="about-btn" onclick="openAbout()">About Me</button>
<span class="cart-icon" onclick="toggleCart()">🛒
<span class="cart-count" id="cartCount">0</span>
</span>
</div>
</header>

<div class="container" id="productContainer"></div>

<div class="cart" id="cart">
<h3>Your Cart</h3>
<div id="cartItems"></div>
<div class="total">Total: ₹<span id="totalPrice">0</span></div>
<br>
<button onclick="toggleCart()">Close</button>
</div>

<div class="about-popup" id="aboutPopup">
<h3>About Me</h3>
<p>
Hi I am <b>Aayu</b> 👋<br><br>
Ma is website ka owner hu.<br><br>
Achha huaa aapne website visit kiya.<br>
I think aapko achha laga hoga 😊<br><br>
Thank you for visiting ❤️
</p>
<button onclick="closeAbout()">Close</button>
</div>

<script>
const products=[
{name:"Iphone 99",price:1000,image:"https://i.ibb.co/fY4DDK62/original-imahft5nxmyqndhf.jpg",rating:4},
{name:"Pova",price:17000,image:"https://i.ibb.co/k2wm3twM/61ik3-Qlkm-ML-AC-UF1000-1000-QL80-FMwebp.webp",rating:5},
{name:"Nothing Phone",price:22000,image:"https://i.ibb.co/QvBS9yFq/images-3.jpg",rating:4},
{name:"CMT Phone",price:15000,image:"https://i.ibb.co/q3sVxW2J/original-imah3ajcxshpd2t2.jpg",rating:3},
{name:"Bracelet",price:1000,image:"https://i.ibb.co/3yv68YtJ/1-3-13.jpg",rating:4},
{name:"Smart Watch",price:2999,image:"https://images.unsplash.com/photo-1516574187841-cb9cc2ca948b"},
{name:"Headphones",price:1999,image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e"},
{name:"Gaming Mouse",price:1499,image:"https://images.unsplash.com/photo-1587202372775-e229f172b9d7"},
{name:"Bluetooth Speaker",price:2499,image:"https://images.unsplash.com/photo-1518444065439-e933c06ce9cd"},
{name:"DSLR Camera",price:45999,image:"https://images.unsplash.com/photo-1519183071298-a2962be96b9f"},
{name:"Laptop Pro",price:59999,image:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853"},
{name:"Drone 4K",price:34999,image:"https://images.unsplash.com/photo-1473968512647-3e447244af8f"},
{name:"LED TV",price:28999,image:"https://images.unsplash.com/photo-1593359677879-a4bb92f829d1"},
{name:"Power Bank",price:1299,image:"https://images.unsplash.com/photo-1580894908361-967195033215"},
{name:"Tablet",price:19999,image:"https://images.unsplash.com/photo-1546054454-aa26e2b734c7"},
{name:"AirPods",price:2999,image:"https://images.unsplash.com/photo-1585386959984-a4155224a1ad"},
{name:"Smart Band",price:999,image:"https://images.unsplash.com/photo-1579586337278-3befd40fd17a"},
{name:"VR Headset",price:4999,image:"https://images.unsplash.com/photo-1593508512255-86ab42a8e620"},
{name:"Gaming Keyboard",price:1999,image:"https://images.unsplash.com/photo-1517336714731-489689fd1ca8"},
{name:"Portable Fan",price:699,image:"https://images.unsplash.com/photo-1582719471387-02dbe1b3c0c4"}
];

let cart=[];

function displayProducts(){
const container=document.getElementById("productContainer");
products.forEach((p,i)=>{
container.innerHTML+=`
<div class="card">
<img src="${p.image}">
<h3>${p.name}</h3>
<p>₹${p.price}</p>
<button class="add-btn" onclick="addToCart(${i})">Add to Cart</button>
</div>`;
});
}

function addToCart(index){
let item=cart.find(c=>c.index===index);
if(item){
item.qty++;
}else{
cart.push({index:index,qty:1});
}
updateCart();
}

function updateCart(){
const cartItems=document.getElementById("cartItems");
cartItems.innerHTML="";
let total=0;
let totalQty=0;

cart.forEach((c,i)=>{
let product=products[c.index];
total+=product.price*c.qty;
totalQty+=c.qty;

cartItems.innerHTML+=`
<div class="cart-item">
<div>
${product.name}<br>
<button class="qty-btn" onclick="changeQty(${i},-1)">-</button>
${c.qty}
<button class="qty-btn" onclick="changeQty(${i},1)">+</button>
<br><span class="remove" onclick="removeItem(${i})">Remove</span>
</div>
<div>₹${product.price*c.qty}</div>
</div>`;
});

document.getElementById("totalPrice").innerText=total;
document.getElementById("cartCount").innerText=totalQty;
}

function changeQty(i,val){
cart[i].qty+=val;
if(cart[i].qty<=0) cart.splice(i,1);
updateCart();
}

function removeItem(i){
cart.splice(i,1);
updateCart();
}

function toggleCart(){
document.getElementById("cart").classList.toggle("active");
}

function openAbout(){
document.getElementById("aboutPopup").style.display="block";
}

function closeAbout(){
document.getElementById("aboutPopup").style.display="none";
}

displayProducts();
</script>

</body>
</html>
