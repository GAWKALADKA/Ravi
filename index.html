<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gudu Shop</title>

<style>
body{margin:0;font-family:'Segoe UI',sans-serif;background:#f1f3f6;}
header{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;background:#2874f0;color:white;}
.logo{font-size:22px;font-weight:bold;}
.search-box{flex:1;margin:0 20px;}
.search-box input{width:100%;padding:8px;border:none;border-radius:4px;}

.filters{display:flex;gap:10px;padding:15px;flex-wrap:wrap;justify-content:center;background:white;}
.filter-btn{padding:6px 12px;border:1px solid #2874f0;background:white;color:#2874f0;cursor:pointer;border-radius:20px;}
.filter-btn.active,.filter-btn:hover{background:#2874f0;color:white;}

.container{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;padding:20px;max-width:1300px;margin:auto;}
@media(max-width:1000px){.container{grid-template-columns:repeat(2,1fr);}}
@media(max-width:600px){.container{grid-template-columns:1fr;}}

.card{background:white;border-radius:6px;padding:15px;text-align:center;position:relative;transition:0.3s;}
.card:hover{box-shadow:0 5px 20px rgba(0,0,0,0.15);transform:translateY(-5px);}
.card img{width:100%;height:200px;object-fit:contain;}
.discount{position:absolute;top:10px;left:10px;background:red;color:white;padding:3px 6px;font-size:12px;border-radius:3px;}
.price{color:#388e3c;font-weight:bold;margin:6px 0;}
.old-price{text-decoration:line-through;color:gray;font-size:14px;}
.rating{color:#ff9800;font-size:14px;}
.add-btn{background:#ff9f00;border:none;padding:8px;width:100%;cursor:pointer;color:white;border-radius:4px;}

.cart-icon{position:fixed;bottom:30px;right:30px;background:#2874f0;color:white;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;}
.cart-count{position:absolute;top:-6px;right:-6px;background:red;color:white;font-size:12px;padding:3px 6px;border-radius:50%;}

.cart{position:fixed;top:0;right:-400px;width:350px;height:100%;background:white;padding:20px;transition:0.4s;overflow:auto;}
.cart.active{right:0;}
.cart-item{border-bottom:1px solid #ddd;padding-bottom:8px;margin-bottom:8px;}
.qty-btn{padding:2px 6px;margin:0 4px;cursor:pointer;}
.total{font-weight:bold;margin-top:10px;}
input{width:100%;padding:6px;margin:5px 0;}
</style>
</head>

<body>

<header>
<div class="logo">Gudu Shop</div>
<div class="search-box">
<input type="text" id="searchInput" placeholder="Search..." onkeyup="searchProduct()">
</div>
</header>

<div class="filters">
<button class="filter-btn active" onclick="filterCategory('All',this)">All</button>
<button class="filter-btn" onclick="filterCategory('Mobile',this)">Mobile</button>
<button class="filter-btn" onclick="filterCategory('Electronics',this)">Electronics</button>
<button class="filter-btn" onclick="filterCategory('Accessories',this)">Accessories</button>
<button class="filter-btn" onclick="filterCategory('Fashion',this)">Fashion</button>
</div>

<div class="container" id="productContainer"></div>

<div class="cart-icon" onclick="toggleCart()">
🛒 <span class="cart-count" id="cartCount">0</span>
</div>

<div class="cart" id="cart">
<h2>Your Cart</h2>
<div id="cartItems"></div>
<div class="total">Total: ₹<span id="totalPrice">0</span></div>
<input type="text" id="custName" placeholder="Your Name">
<input type="number" id="custPhone" placeholder="Phone Number">
<button class="add-btn" onclick="submitOrder()">Submit Order</button>
<button onclick="toggleCart()">Close</button>
</div>

<script>
const products=[
{name:"Iphone 99",price:1000,old:1500,cat:"Mobile",rating:4,image:"https://i.ibb.co/fY4DDK62/original-imahft5nxmyqndhf.jpg"},
{name:"Pova",price:17000,old:19000,cat:"Mobile",rating:5,image:"https://i.ibb.co/k2wm3twM/61ik3-Qlkm-ML-AC-UF1000-1000-QL80-FMwebp.webp"},
{name:"Nothing Phone",price:22000,old:25000,cat:"Mobile",rating:4,image:"https://i.ibb.co/QvBS9yFq/images-3.jpg"},
{name:"CMT Phone",price:15000,old:18000,cat:"Mobile",rating:3,image:"https://i.ibb.co/q3sVxW2J/original-imah3ajcxshpd2t2.jpg"},
{name:"Samsung Galaxy",price:21000,old:24000,cat:"Mobile",rating:4,image:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9"},

{name:"Laptop Pro",price:55000,old:60000,cat:"Electronics",rating:5,image:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853"},
{name:"Smart TV",price:28000,old:32000,cat:"Electronics",rating:4,image:"https://images.unsplash.com/photo-1593359677879-a4bb92f829d1"},
{name:"Bluetooth Speaker",price:2500,old:3000,cat:"Electronics",rating:4,image:"https://images.unsplash.com/photo-1518444065439-e933c06ce9cd"},
{name:"DSLR Camera",price:45000,old:50000,cat:"Electronics",rating:5,image:"https://images.unsplash.com/photo-1519183071298-a2962be96b9f"},

{name:"Headphones",price:1999,old:2499,cat:"Accessories",rating:4,image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e"},
{name:"Smart Watch",price:2999,old:3999,cat:"Accessories",rating:4,image:"https://images.unsplash.com/photo-1516574187841-cb9cc2ca948b"},
{name:"Power Bank",price:1299,old:1599,cat:"Accessories",rating:4,image:"https://images.unsplash.com/photo-1580894908361-967195033215"},
{name:"Gaming Mouse",price:1499,old:1999,cat:"Accessories",rating:4,image:"https://images.unsplash.com/photo-1587202372775-e229f172b9d7"},
{name:"Keyboard",price:999,old:1299,cat:"Accessories",rating:4,image:"https://images.unsplash.com/photo-1517336714731-489689fd1ca8"},

{name:"Bracelet",price:1000,old:1500,cat:"Fashion",rating:4,image:"https://i.ibb.co/3yv68YtJ/1-3-13.jpg"},
{name:"Sunglasses",price:799,old:1200,cat:"Fashion",rating:4,image:"https://images.unsplash.com/photo-1511499767150-a48a237f0083"},
{name:"Shoes",price:2499,old:3000,cat:"Fashion",rating:5,image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff"},
{name:"Backpack",price:1599,old:1999,cat:"Fashion",rating:4,image:"https://images.unsplash.com/photo-1503342217505-b0a15ec3261c"},
{name:"Watch Classic",price:1999,old:2500,cat:"Fashion",rating:4,image:"https://images.unsplash.com/photo-1519744346363-d6d7c1c39a3f"},
{name:"Wallet",price:599,old:999,cat:"Fashion",rating:4,image:"https://images.unsplash.com/photo-1585386959984-a4155224a1ad"},
{name:"Cap",price:399,old:699,cat:"Fashion",rating:3,image:"https://images.unsplash.com/photo-1520975922284-9e6b6fdfc87c"},
{name:"T-Shirt",price:699,old:999,cat:"Fashion",rating:4,image:"https://images.unsplash.com/photo-1520975693415-cd8a5d21e8c2"}
];

let filteredProducts=[...products];
let cart=[];

function displayProducts(){
const container=document.getElementById("productContainer");
container.innerHTML="";
filteredProducts.forEach((p,i)=>{
let stars="★".repeat(p.rating)+"☆".repeat(5-p.rating);
container.innerHTML+=`
<div class="card">
<div class="discount">${Math.round((1-p.price/p.old)*100)}% OFF</div>
<img src="${p.image}" onerror="this.src='https://via.placeholder.com/200x200?text=No+Image'">
<h4>${p.name}</h4>
<div class="rating">${stars}</div>
<div class="old-price">₹${p.old}</div>
<div class="price">₹${p.price}</div>
<button class="add-btn" onclick="addToCart(${products.indexOf(p)})">Add to Cart</button>
</div>`;
});
}
displayProducts();

function searchProduct(){
let val=document.getElementById("searchInput").value.toLowerCase();
filteredProducts=products.filter(p=>p.name.toLowerCase().includes(val));
displayProducts();
}

function filterCategory(cat,btn){
document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
if(cat=="All"){filteredProducts=[...products];}
else{filteredProducts=products.filter(p=>p.cat==cat);}
displayProducts();
}

function addToCart(i){
let item=cart.find(c=>c.index===i);
if(item){item.qty++;}
else{cart.push({index:i,qty:1});}
updateCart();
}

function updateCart(){
let html="",total=0,totalQty=0;
cart.forEach((c,i)=>{
let p=products[c.index];
total+=p.price*c.qty;
totalQty+=c.qty;
html+=`${p.name} x ${c.qty}<br>`;
});
document.getElementById("cartItems").innerHTML=html;
document.getElementById("totalPrice").innerText=total;
document.getElementById("cartCount").innerText=totalQty;
}

function toggleCart(){document.getElementById("cart").classList.toggle("active");}
function submitOrder(){alert("Order Submitted Successfully!");cart=[];updateCart();toggleCart();}
</script>

</body>
</html>
